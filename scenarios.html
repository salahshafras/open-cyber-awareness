<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phishing Training — Scenarios</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/scenarios.css" />
</head>
<body class="scenarios">
  <div class="page-wrap">
    <div data-include="header"></div>

    <main class="page-content wrap">
      <div class="page-head">
        <h1>Select a scenario</h1>
        <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>

      </div>

      <section id="scenario-grid" class="scenario-grid" aria-label="Scenario list"></section>
    </main>

    <div data-include="footer"></div>
  </div>

  <script type="module" src="js/main.js"></script>
  <script src="js/scenarios.js"></script>
</body>
</html>
